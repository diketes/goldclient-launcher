<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pobieranie GoldClient</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo3d.png" type="image/png">
<style>
@font-face{font-family:'Chakra Petch';src:url(fonts/chakra-700-latin.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Monocraft';src:url(fonts/Monocraft.ttf) format('truetype');font-weight:400;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#07070e url(img/hero-bg.jpg) center/cover;color:#eef0ff;font-family:'Inter','Segoe UI',system-ui,sans-serif;text-align:center;padding:24px}
.box{background:rgba(7,7,14,.86);border:1px solid rgba(245,197,24,.32);border-radius:20px;padding:44px 46px;backdrop-filter:blur(12px);max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
img.logo{width:64px;height:64px;margin:0 auto 18px;filter:drop-shadow(0 0 16px rgba(245,197,24,.5))}
h1{font-family:'Chakra Petch','Segoe UI',sans-serif;font-size:30px;color:#f5c518;margin-bottom:10px}
p{color:#a4a8c8;margin-bottom:8px;line-height:1.6;font-size:15px}
.info{font-family:'Monocraft',monospace;font-size:12px;color:#5f6386;margin-top:14px}
.spin{width:34px;height:34px;margin:22px auto 6px;border:3px solid rgba(245,197,24,.2);border-top-color:#f5c518;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
a.btn{display:inline-block;margin-top:18px;background:linear-gradient(135deg,#ffe066,#f5c518 45%,#e0ad00);color:#1a1400;font-weight:700;padding:13px 24px;border-radius:12px;text-decoration:none}
a.back{display:inline-block;margin-top:14px;color:#a4a8c8;font-size:13.5px}
.err{color:#f87171}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="img/logo3d.png" alt="GoldClient">
  <h1 id="tytul">Przygotowuję pobieranie…</h1>
  <p id="opis">Za chwilę ruszy pobieranie instalatora GoldClient.</p>
  <div class="spin" id="spin"></div>
  <p class="info" id="info"></p>
  <div id="akcje"></div>
  <a class="back" href="./">← Wróć na stronę główną</a>
</div>
<script>
(function () {
  var tytul = document.getElementById('tytul');
  var opis = document.getElementById('opis');
  var info = document.getElementById('info');
  var spin = document.getElementById('spin');
  var akcje = document.getElementById('akcje');
  var mb = function (b) { return Math.round(b / 1048576) + ' MB'; };

  function gotowe(url, wersja, rozmiar) {
    spin.style.display = 'none';
    tytul.textContent = 'Pobieranie ruszyło';
    opis.textContent = 'Jeśli nic się nie dzieje, kliknij przycisk poniżej.';
    info.textContent = 'GoldClient ' + wersja + '  ·  ' + rozmiar;
    akcje.innerHTML = '<a class="btn" href="' + url + '">Pobierz ręcznie</a>';
    // licznik kliknięć „Pobierz" — 20-bajtowy plik z serwisu wydań, bez ciasteczek i danych o odwiedzającym
    try { fetch('https://github.com/diketes/goldclient-launcher/releases/download/v1.2.0/www-pobierz.txt?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store', credentials: 'omit', keepalive: true }).catch(function () {}); } catch (e) {}
    location.href = url;
  }

  function blad() {
    spin.style.display = 'none';
    tytul.textContent = 'Nie udało się pobrać';
    tytul.className = 'err';
    opis.textContent = 'Coś poszło nie tak przy sprawdzaniu najnowszej wersji. Spróbuj odświeżyć stronę za chwilę.';
  }

  // zawsze najnowsze wydanie — starszych wersji nie udostępniamy
  var url = 'https://api.github.com/repos/diketes/goldclient-launcher/releases/latest';

  fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (rel) {
      var exe = (rel.assets || []).filter(function (a) { return /\.exe$/i.test(a.name); })[0];
      if (!exe) throw 0;
      gotowe(exe.browser_download_url, String(rel.tag_name || ''), mb(exe.size));
    })
    .catch(blad);
})();
</script>
</body>
</html>
